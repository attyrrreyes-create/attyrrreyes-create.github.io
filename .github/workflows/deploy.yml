name: Deploy SME Audit Site to GitHub Pages

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./sme-legal-audit-site
          publish_branch: gh-pages
          # Optional: set your custom domain here or replace the CNAME file in the publish_dir
          cname: your.custom.domain.example
